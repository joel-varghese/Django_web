services:
  db:
    image: postgres:17
    container_name: expenseweb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expenseweb
      POSTGRES_USER: expenseweb
      POSTGRES_PASSWORD: expenseweb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
